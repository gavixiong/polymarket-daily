<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket 日报</title>
<meta name="description" content="每天一份 Polymarket 预测市场短报：时政、金融、科技三类市场的概率变动、热门事件、新上线、刚结算与大单追踪。">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s1-track:#cde2fb; --up:#2a78d6; --down:#e34948; --mid:#f0efec;
  --good:#006300; --chip:#f0efec;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s1-track:#0d366b; --up:#3987e5; --down:#e66767; --mid:#383835;
    --good:#0ca30c; --chip:#2c2c2a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s1-track:#0d366b; --up:#3987e5; --down:#e66767; --mid:#383835;
  --good:#0ca30c; --chip:#2c2c2a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:22px 0 14px;border-bottom:1px solid var(--grid)}
header h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:13px}
header .spacer{flex:1}
select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
button.tab{border-radius:999px;padding:6px 14px}
button.tab[aria-selected="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.grid{display:grid;gap:16px}
.hero{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);margin-top:18px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--ink-2);font-weight:600;letter-spacing:.02em}
.digest{font-size:15.5px}
.digest h1{font-size:20px;margin:0 0 10px}
.digest h2{font-size:15px;margin:16px 0 6px;color:var(--ink)}
.digest p,.digest li{margin:4px 0}
.digest ul{padding-left:20px}
.digest .empty{color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.tile .label{font-size:12.5px;color:var(--muted)}
.tile .value{font-size:28px;font-weight:600;line-height:1.15;margin-top:4px}
.tile .delta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.tabs{display:flex;gap:8px;margin:28px 0 12px;flex-wrap:wrap}
section.panel{display:none}
section.panel.active{display:block}
.two{grid-template-columns:1fr 1fr}
@media (max-width:860px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--grid)}
td{padding:8px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.panel td:first-child{min-width:220px}
.scroll{overflow-x:auto}
.ev{color:var(--muted);font-size:12.5px;display:block;margin-top:1px}
.bar{position:relative;height:10px;min-width:120px;border-radius:0 4px 4px 0;background:var(--mid)}
.bar.div{border-radius:4px}
.bar i{position:absolute;top:0;bottom:0;display:block}
.bar.div::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--axis)}
.bar i.up{left:50%;background:var(--up);border-radius:0 4px 4px 0}
.bar i.down{right:50%;background:var(--down);border-radius:4px 0 0 4px}
.bar i.vol{left:0;background:var(--s1);border-radius:0 4px 4px 0}
.bar.track{background:var(--s1-track)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted)}
ul.list{list-style:none;padding:0;margin:0}
ul.list li{padding:9px 0;border-bottom:1px solid var(--grid)}
ul.list li:last-child{border-bottom:0}
.row{display:flex;gap:12px;align-items:baseline}
.row .t{flex:1;min-width:0}
.row .v{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.result{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:600;background:var(--chip)}
.result.yes{color:var(--good)}
.result.no{color:var(--ink-2)}
svg.spark{display:block;width:96px;height:26px;overflow:visible}
.watch{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.watch .card{padding:14px 16px}
.watch .card h3{font-size:14px;margin:0 0 2px;font-weight:600}
.watch .note{font-size:12px;color:var(--muted);margin-bottom:8px}
.wl{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--grid);font-size:13.5px}
.wl:first-of-type{border-top:0}
.wl b{font-variant-numeric:tabular-nums;font-weight:600}
.wl small{color:var(--ink-2);margin-left:6px;font-variant-numeric:tabular-nums}
footer{margin-top:36px;color:var(--muted);font-size:12.5px;line-height:1.7}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
h2.sec{font-size:17px;margin:30px 0 12px;font-weight:650}
.src{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Polymarket 日报</h1>
    <span class="sub" id="gen"></span>
    <span class="spacer"></span>
    <label class="sub">日期 <select id="date"></select></label>
    <button id="theme" title="切换深浅色">◐</button>
  </header>

  <div class="grid hero">
    <article class="card digest" id="digest"><h2>今日短报</h2><p class="empty">加载中…</p></article>
    <div class="tiles" id="tiles"></div>
  </div>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panels"></div>

  <h2 class="sec">大单追踪 <span class="src">单笔 ≥ $10k · 过去 24 小时 · 仅时政/金融/科技</span></h2>
  <div class="card scroll" id="whales"></div>

  <h2 class="sec">固定关注池</h2>
  <div class="grid watch" id="watch"></div>

  <footer>
    数据来自 Polymarket 公开接口（Gamma / CLOB / Data API），每日北京时间 08:00 抓取。概率 = 市场 Yes 价格；变动为过去 24 小时的百分点变化。
    短报由 Claude 根据抓取数据撰写，不构成任何投资建议。
    <br>源码与历史数据见仓库 <code>data/</code> 与 <code>reports/</code> 目录。
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => x == null ? '—' : Math.round(x * 100) + '%';
const pt = x => x == null ? '' : (x >= 0 ? '+' : '−') + Math.abs(Math.round(x * 100)) + 'pt';
const usd = x => x >= 1e6 ? '$' + (x / 1e6).toFixed(1) + 'M' : x >= 1e3 ? '$' + Math.round(x / 1e3) + 'k' : '$' + Math.round(x);
const CATS = ['politics', 'finance', 'tech'];

// theme toggle: auto -> dark -> light -> auto
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || 'auto';
  const next = cur === 'auto' ? 'dark' : cur === 'dark' ? 'light' : 'auto';
  if (next === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch (e) {}
};
try { const t = localStorage.getItem('theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}

function divBar(ch, max) {
  const w = Math.min(50, Math.abs(ch) / max * 50);
  return `<div class="bar div" title="${pt(ch)}"><i class="${ch >= 0 ? 'up' : 'down'}" style="width:${w}%"></i></div>`;
}
function volBar(v, max) {
  return `<div class="bar track" title="${usd(v)}"><i class="vol" style="width:${Math.max(2, v / max * 100)}%"></i></div>`;
}
function spark(pts) {
  if (!pts || pts.length < 2) return '';
  const W = 96, H = 26, ys = pts.map(p => p[1]);
  const lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || 0.01;
  const xy = pts.map((p, i) => [i / (pts.length - 1) * W, H - 3 - (p[1] - lo) / span * (H - 6)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  const [ex, ey] = xy[xy.length - 1];
  const t0 = new Date(pts[0][0] * 1000).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-label="近 7 天走势"><title>${t0} ${pct(ys[0])} → 今日 ${pct(ys[ys.length - 1])}（近 7 天）</title>
    <path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
function chips(leaders) {
  return `<div class="chips">${(leaders || []).map(l =>
    `<span class="chip">${esc(l.label)} <b>${pct(l.yes)}</b>${l.change1d && Math.abs(l.change1d) >= 0.005 ? ` <small>${pt(l.change1d)}</small>` : ''}</span>`).join('')}</div>`;
}

function renderMovers(ms) {
  if (!ms.length) return '<p class="empty">今日无显著变动（阈值：24 小时内 ≥ 5 个百分点）。</p>';
  const max = Math.max(...ms.map(m => Math.abs(m.change1d)));
  return `<div class="scroll"><table><thead><tr><th>市场</th><th>现在</th><th>24h 变动</th><th></th><th>7 天</th><th style="text-align:right">24h 成交</th></tr></thead><tbody>${
    ms.map(m => `<tr>
      <td><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label)}</a><span class="ev">${esc(m.eventTitle)}</span></td>
      <td class="num"><b>${pct(m.yes)}</b></td>
      <td class="num">${pt(m.change1d)}</td>
      <td>${divBar(m.change1d, max)}</td>
      <td>${spark(m.sparkline)}</td>
      <td class="num">${usd(m.volume24h)}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderHot(es) {
  if (!es.length) return '<p class="empty">无数据。</p>';
  const max = Math.max(...es.map(e => e.volume24h));
  return `<ul class="list">${es.map(e => `<li>
    <div class="row"><div class="t"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></div><div class="v">${usd(e.volume24h)}</div></div>
    <div style="margin:5px 0 2px">${volBar(e.volume24h, max)}</div>${chips(e.leaders.slice(0, 3))}</li>`).join('')}</ul>`;
}
function renderNew(es) {
  if (!es.length) return '<p class="empty">过去 24 小时没有新上线的相关事件。</p>';
  return `<ul class="list">${es.map(e => `<li><div class="row"><div class="t"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></div><div class="v">${e.volume24h ? usd(e.volume24h) : ''}</div></div>${chips(e.leaders.slice(0, 3))}</li>`).join('')}</ul>`;
}
function renderResolved(rs) {
  if (!rs.length) return '<p class="empty">过去 36 小时没有达到成交量门槛的结算。</p>';
  return `<ul class="list">${rs.map(r => `<li><div class="row"><span class="result ${/^yes$/i.test(r.result) ? 'yes' : 'no'}">${esc(r.result)}</span><div class="t">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.question)}</a>` : esc(r.question)}</div><div class="v">${usd(r.volume)}</div></div></li>`).join('')}</ul>`;
}
function renderWhales(ws) {
  if (!ws.length) return '<p class="empty">过去 24 小时没有相关大单。</p>';
  return `<table><thead><tr><th style="text-align:right">金额</th><th>方向</th><th>市场</th><th>交易者</th><th>时间</th></tr></thead><tbody>${ws.map(w => `<tr>
    <td class="num"><b>${usd(w.usd)}</b></td>
    <td style="white-space:nowrap">${w.side === 'BUY' ? '买入' : '卖出'} <b>${esc(w.outcome)}</b> @${(w.price).toFixed(2)}</td>
    <td><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title)}</a><span class="ev">${esc(w.eventTitle)}</span></td>
    <td>${esc(w.trader)}</td>
    <td class="num">${new Date(w.timestamp * 1000).toLocaleString('zh-CN', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td></tr>`).join('')}</tbody></table>`;
}
function renderWatch(wl) {
  if (!wl.length) return '<p class="empty">暂无关注池配置。</p>';
  return wl.map(e => `<article class="card"><h3><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></h3><div class="note">${esc(e.note || '')}${e.endDate ? ' · 截止 ' + e.endDate.slice(0, 10) : ''}</div>${
    e.leaders.map(l => `<div class="wl"><span>${esc(l.label)}</span><span><b>${pct(l.yes)}</b>${l.change1d && Math.abs(l.change1d) >= 0.005 ? `<small>${pt(l.change1d)}</small>` : ''}</span></div>`).join('')}</article>`).join('');
}

function render(day, md) {
  $('#gen').textContent = `生成于 ${day.generatedAt}`;
  // digest
  const dg = $('#digest');
  if (md) {
    dg.innerHTML = typeof marked !== 'undefined' ? marked.parse(md) : `<pre style="white-space:pre-wrap">${esc(md)}</pre>`;
  } else {
    dg.innerHTML = `<h2>今日短报</h2><p class="empty">${esc(day.date)} 的短报尚未生成，下方为原始数据。</p>`;
  }
  // tiles
  const allMovers = CATS.flatMap(c => day.categories[c].movers);
  const big = allMovers.slice().sort((a, b) => Math.abs(b.change1d) - Math.abs(a.change1d))[0];
  const whaleSum = day.whales.reduce((s, w) => s + w.usd, 0);
  const resolved = CATS.reduce((s, c) => s + day.categories[c].resolved.length, 0);
  $('#tiles').innerHTML = [
    ['扫描事件', day.stats.eventsScanned, '时政 / 金融 / 科技，去噪后'],
    ['显著变动', allMovers.length, '24 小时内 ≥ 5 个百分点'],
    ['最大变动', big ? pt(big.change1d) : '—', big ? `${big.eventTitle} · ${big.label}` : ''],
    ['大单合计', usd(whaleSum), `${day.whales.length} 笔 · 另有 ${resolved} 个市场结算`],
  ].map(([l, v, d]) => `<div class="tile"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="delta">${esc(d)}</div></div>`).join('');
  // tabs + panels
  $('#tabs').innerHTML = CATS.map((c, i) => `<button class="tab" role="tab" data-cat="${c}" aria-selected="${i === 0}">${esc(day.categories[c].label)} <small style="color:inherit;opacity:.7">${day.categories[c].movers.length}↕ ${day.categories[c].hot.length}🔥</small></button>`).join('');
  $('#panels').innerHTML = CATS.map((c, i) => {
    const d = day.categories[c];
    return `<section class="panel${i === 0 ? ' active' : ''}" id="panel-${c}">
      <div class="grid"><article class="card"><h2>24 小时最大变动</h2>${renderMovers(d.movers)}</article></div>
      <div class="grid two" style="margin-top:16px">
        <article class="card"><h2>24 小时热门</h2>${renderHot(d.hot)}</article>
        <div class="grid"><article class="card"><h2>新上线</h2>${renderNew(d.new)}</article><article class="card"><h2>刚结算</h2>${renderResolved(d.resolved)}</article></div>
      </div></section>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + b.dataset.cat));
  });
  $('#whales').innerHTML = renderWhales(day.whales);
  $('#watch').innerHTML = renderWatch(day.watchlist);
  document.title = `Polymarket 日报 · ${day.date}`;
}

async function loadDay(date) {
  location.hash = date;
  const [day, md] = await Promise.all([
    fetch(`data/${date}.json`, { cache: 'no-store' }).then(r => r.json()),
    fetch(`reports/${date}.md`, { cache: 'no-store' }).then(r => r.ok ? r.text() : null).catch(() => null),
  ]);
  render(day, md);
}
(async () => {
  try {
    const idx = await fetch('data/index.json', { cache: 'no-store' }).then(r => r.json());
    const sel = $('#date');
    sel.innerHTML = idx.dates.map(d => `<option value="${d}">${d}</option>`).join('');
    const want = location.hash.slice(1);
    sel.value = idx.dates.includes(want) ? want : idx.latest;
    sel.onchange = () => loadDay(sel.value);
    await loadDay(sel.value);
  } catch (e) {
    $('#digest').innerHTML = `<h2>今日短报</h2><p class="empty">数据加载失败：${esc(e.message)}。请确认 data/index.json 存在。</p>`;
  }
})();
</script>
</body>
</html>
