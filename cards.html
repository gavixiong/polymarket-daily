<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket 日报 · 卡片</title>
<meta name="description" content="小红书图片卡片，1242×1660。无参数为预览全部，?card=cover 单张用于截图。">
<link rel="icon" type="image/png" href="assets/brand/icon-blue.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="assets/shared.js"></script>
<style>
:root{
  --page:#eeede8; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --mid:#f0efec; --chip:#f0efec; --good:#006300;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c8:#e34948; --wash:rgba(42,120,214,.10);
  --up:#2a78d6; --down:#e34948;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
body.single{background:#fff}
/* card frame */
.card{width:1242px;height:1660px;background:var(--surface);position:relative;overflow:hidden;padding:84px 80px 72px;display:flex;flex-direction:column}
.brand{display:flex;justify-content:space-between;color:var(--muted);font-size:30px;font-weight:500} .brand b{color:var(--ink);font-weight:650;display:inline-flex;align-items:center;gap:14px} .brand img{width:38px;height:38px;display:block}
.card h1{font-size:64px;line-height:1.15;margin:40px 0 10px;font-weight:650;letter-spacing:-.01em}
.sub{font-size:30px;color:var(--ink-2);margin:0 0 30px;line-height:1.4}
.foot{margin-top:auto;padding-top:28px;border-top:2px solid var(--grid);display:flex;justify-content:space-between;color:var(--muted);font-size:26px} .foot b{color:var(--ink-2);font-weight:500}
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:24px;padding:18px 0;border-bottom:2px solid var(--grid);font-size:34px;line-height:1.3} .row:last-child{border-bottom:0}
.row .n{color:var(--muted);font-size:28px;width:40px;text-align:right}
.row .t{min-width:0} .row .t small{display:block;color:var(--muted);font-size:24px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .p{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;font-size:40px}
.row .d{font-variant-numeric:tabular-nums;font-size:30px;color:var(--ink-2);white-space:nowrap}
.tag{display:inline-block;font-size:26px;color:var(--muted);border:2px solid var(--grid);border-radius:10px;padding:2px 14px;margin-left:12px;vertical-align:middle}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:4px 16px;font-size:26px;color:var(--ink-2);font-weight:600;white-space:nowrap} .chip.yes{color:var(--good)} .chip.lane{font-weight:500;font-size:24px;margin-right:12px}
/* charts (sizes for the card) */
.bar{position:relative;height:18px;width:220px;border-radius:6px;background:var(--mid)} .bar::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--axis)}
.bar i{position:absolute;top:0;bottom:0} .bar i.up{left:50%;background:var(--up);border-radius:0 6px 6px 0} .bar i.down{right:50%;background:var(--down);border-radius:6px 0 0 6px}
svg.spark{width:180px;height:56px;overflow:visible;display:block}
.share{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:3px;margin:14px 0 10px;background:var(--surface)} .share i{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:27px;color:var(--ink-2)} .legend b{display:inline-block;width:18px;height:18px;border-radius:4px;margin-right:8px;vertical-align:-1px} .legend strong{color:var(--ink);font-variant-numeric:tabular-nums} .legend small{color:var(--muted);margin-left:6px;font-size:24px}
.ladder{display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:center;margin-top:12px;font-size:27px}
.rung{display:contents} .rl{color:var(--ink-2);white-space:nowrap} .rt{height:16px;background:var(--mid);border-radius:6px;overflow:hidden} .rt i{display:block;height:100%;background:var(--c1);border-radius:0 6px 6px 0}
.rv{font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap} .rv small{color:var(--muted);margin-left:6px;font-size:24px}
/* cover */
.cover h1{font-size:84px;margin-top:110px;line-height:1.2;letter-spacing:-.02em}
.cover .lede{font-size:36px;line-height:1.5;color:var(--ink-2);margin:26px 0 0;min-height:110px}
.cover .date{font-size:40px;color:var(--ink-2);margin-top:30px}
.cover .hero{margin-top:110px;padding-top:56px;border-top:4px solid var(--ink)}
.cover .hero .v{font-size:176px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.cover .hero .l{font-size:36px;color:var(--ink-2);margin-top:28px;line-height:1.4}
.cover .foot{margin-top:0}
.cover .big{position:absolute;right:-60px;top:-80px;font-size:520px;font-weight:800;color:var(--c1);opacity:.07;line-height:1;letter-spacing:-.05em}
.kpis{display:flex;gap:28px;margin-top:30px} .kpi{flex:1;padding:26px 30px;border:2px solid var(--grid);border-radius:18px} .kpi .l{font-size:26px;color:var(--muted)} .kpi .v{font-size:56px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}
.cover .kpis{margin-top:auto;margin-bottom:28px}
/* headline chart */
.chart svg.main{width:1082px;height:700px;display:block;overflow:visible}
.cause{margin-top:34px;font-size:34px;line-height:1.5;color:var(--ink-2);padding:26px 32px;background:var(--mid);border-radius:18px} .cause b{color:var(--ink)}
/* hot (long-running panel) */
.hot .row{grid-template-columns:1fr;padding:16px 0} .hot .title{display:flex;justify-content:space-between;font-size:32px} .hot .title small{color:var(--muted);font-size:24px}
.hot .pin{color:var(--c4);margin-right:8px}
/* gallery */
.ghead{padding:24px 28px 0;font-size:16px;color:var(--ink-2)} .ghead b{color:var(--ink)} .ghead button{font:inherit;padding:3px 12px;border:1px solid var(--grid);border-radius:8px;background:#fff;cursor:pointer;margin-left:8px}
.gallery{padding:28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:28px}
.thumb{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)} .thumb .frame{width:310px;height:414px;overflow:hidden;border-radius:8px;border:1px solid var(--grid)} .thumb .card{transform:scale(.2496);transform-origin:0 0}
.thumb .cap{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--ink-2)} .thumb .cap a{color:var(--c1);text-decoration:none} .off{color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const { esc, pct, pt, usd, shortDate, cnDate, stamp, label, outcomeLabel, outcomeChart, changeBar, spark, officialRows, resolvedRows, newRows, hotRows, overlay } = PM;
const q = new URLSearchParams(location.search);

const brand = (day, right) => `<div class="brand"><span><b><img src="assets/brand/icon-black.png" alt="">Polymarket 日报</b> · ${esc(shortDate(day.date))}</span><span>${esc(right)}</span></div>`;
// Every card's footer carries the data timestamp in both time zones; the left side is the card's own note.
let FOOT_DAY = null;
const foot = (left, right) => `<div class="foot"><span>${esc(left)}</span><span><b>${esc(right || (FOOT_DAY ? stamp(FOOT_DAY) : ''))}</b></span></div>`;
const zh = s => { const z = label(s); return `${esc(z)}${z !== s ? `<small>${esc(s)}</small>` : ''}`; };

function headlineMarket(day) {
  const all = Object.values(day.official).flat(), want = overlay().headlineQuestion;
  return (want && all.find(m => m.question === want)) || all.filter(m => (m.history7d || []).length >= 20).sort((a, b) => Math.abs(b.change1d) - Math.abs(a.change1d))[0] || officialRows(day, 'politics', 1)[0];
}

const CARDS = {
  cover(day) {
    const o = overlay(), top = officialRows(day, 'politics', 1)[0];
    const hero = o.hero || { value: top ? pt(top.change1d) : '—', label: top ? label(top.question) : '' };
    const headline = o.headline || (day.xhsFirst || ''), title = o.title || '';
    // Width estimate: CJK ~1em, Latin/digits ~0.55em, spaces ~0.3em. Fit one line at 84px, else shrink to two full lines.
    const units = [...title].reduce((n, ch) => n + (/[一-鿿]/.test(ch) ? 1 : ch === ' ' ? 0.3 : 0.55), 0);
    const size = units * 84 <= 1082 ? 84 : 1082 / units >= 62 ? Math.floor(1082 / units) : 72;  // one line if it can be read at 62px+, else two lines at 72px
    return `<section class="card cover"><div class="big">${esc(shortDate(day.date).replace('/', '.'))}</div>${brand(day, '每日 07:00')}
      <div class="date">${esc(cnDate(day.date))}<span style="display:block;font-size:28px;color:var(--muted);margin-top:8px">${esc(stamp(day))}</span></div><h1 style="font-size:${size}px">${esc(title || headline)}</h1>${title ? `<p class="lede">${esc(headline)}</p>` : ''}
      <div class="hero"><div class="v">${esc(hero.value)}</div><div class="l">${esc(hero.label)}</div></div>
      <div class="kpis"><div class="kpi"><div class="l">变动 ≥10pt</div><div class="v">${['politics', 'finance', 'tech'].flatMap(g => officialRows(day, g, 99)).filter(m => Math.abs(m.change1d) >= 0.1).length} 个</div></div>
        <div class="kpi"><div class="l">昨日结算</div><div class="v">${resolvedRows(day, 99).length} 个</div></div><div class="kpi"><div class="l">新上线</div><div class="v">${newRows(day, 99).length} 个</div></div></div>
      ${foot('预测市场里的今日世界', '数据 Polymarket · 每天北京时间 07:00 更新')}</section>`;
  },
  headline(day) {
    const m = headlineMarket(day); if (!m) return '';
    const o = overlay(), pts = (m.history7d && m.history7d.length >= 2) ? m.history7d : m.sparkline;
    const W = 1082, H = 700, pl = 110, pr = 40, ptop = 40, pb = 70, x0 = pts[0][0], x1 = pts[pts.length - 1][0];
    const X = t => pl + (t - x0) / ((x1 - x0) || 1) * (W - pl - pr), Y = p => ptop + (1 - p) * (H - ptop - pb);
    const path = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('');
    const days = []; for (let t = x0; t <= x1; t += 86400) days.push(t);
    const fmt = t => { const d = new Date(t * 1000); return `${d.getMonth() + 1}/${d.getDate()}`; };
    const first = pts[0][1], last = pts[pts.length - 1][1], sinceLabel = `起点 ${fmt(x0)}`;
    const svg = `<svg class="main" viewBox="0 0 ${W} ${H}">
      ${[0, .25, .5, .75, 1].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="2"/><text x="${pl - 18}" y="${Y(v) + 10}" text-anchor="end" font-size="26" fill="var(--muted)">${v * 100}%</text>`).join('')}
      ${days.filter((_, i) => i % Math.ceil(days.length / 7) === 0).map(t => `<text x="${X(t)}" y="${H - 22}" text-anchor="middle" font-size="26" fill="var(--muted)">${fmt(t)}</text>`).join('')}
      <path d="${path}L${X(x1).toFixed(1)},${Y(0).toFixed(1)}L${X(x0).toFixed(1)},${Y(0).toFixed(1)}Z" fill="var(--wash)"/>
      <path d="${path}" fill="none" stroke="var(--c1)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(x1)}" cy="${Y(last)}" r="12" fill="var(--c1)" stroke="var(--surface)" stroke-width="5"/>
      <text x="${Math.min(X(x1), W - pr - 90)}" y="${Y(last) - 26}" text-anchor="middle" font-size="40" font-weight="700" fill="var(--ink)">${pct(last)}</text>
      <text x="${X(x0) + 8}" y="${Y(first) - 20}" font-size="28" font-weight="600" fill="var(--ink-2)" style="paint-order:stroke" stroke="var(--surface)" stroke-width="8">${pct(first)}</text></svg>`;
    return `<section class="card chart">${brand(day, '今日头条')}<h1>${esc(o.headlineTitle || label(m.question))}</h1><p class="sub">${esc(m.question)}</p>${svg}
      <div class="kpis"><div class="kpi"><div class="l">现在</div><div class="v">${pct(m.yes)}</div></div><div class="kpi"><div class="l">24 小时</div><div class="v">${pt(m.change1d)}</div></div><div class="kpi"><div class="l">${sinceLabel}</div><div class="v">${pct(first)}</div></div></div>
      ${o.headlineCause ? `<div class="cause"><b>为什么：</b>${esc(o.headlineCause)}</div>` : ''}${foot('近 7 天 Yes 概率', m.closed ? '已结算' : '未结算')}</section>`;
  },
  breaking(day) {
    const rows = ['politics', 'finance', 'tech'].flatMap(g => officialRows(day, g, 8)).sort((a, b) => Math.abs(b.change1d) - Math.abs(a.change1d));
    const seen = new Set(), uniq = rows.filter(m => !seen.has(m.question) && seen.add(m.question)).slice(0, 8);
    const max = Math.max(...uniq.map(m => Math.abs(m.change1d)));
    return `<section class="card">${brand(day, '突发榜')}<h1>今天概率变得最厉害的市场</h1><p class="sub">官方 Breaking 榜 · 过去 24 小时 · 已剔除无信息量的档位</p>
      <div class="rows">${uniq.map((m, i) => `<div class="row" style="grid-template-columns:40px 1fr 110px 220px 180px"><div class="n">${i + 1}</div><div class="t">${zh(m.question)}${m.closed ? '<span class="tag">已结算</span>' : ''}</div>
        <div class="p">${pct(m.yes)}</div><div><div class="d" style="margin-bottom:6px">${pt(m.change1d)}</div>${changeBar(m.change1d, max)}</div><div>${spark(m.sparkline, 180, 56, 4, 8)}</div></div>`).join('')}</div>
      ${foot('变动条 = 24 小时概率变化 · 走势 = 24 小时')}</section>`;
  },
  hot(day) {
    const rows = hotRows(day, 8);
    return `<section class="card hot">${brand(day, '长期关注')}<h1>长期关注的市场今天怎么看</h1><p class="sub">★ 连续多日高关注 · 其余按成交量 · 临近截止的标倒计时</p>
      <div class="rows">${rows.map(e => `<div class="row"><div class="title"><span>${PM.hotTitle(e)}</span><small>${usd(e.volume24h)}</small></div>${outcomeChart(e)}</div>`).join('')}</div>
      ${foot('互斥选项画成份额，日期/价格档位各画一条')}</section>`;
  },
  resolved(day) {
    const rows = resolvedRows(day, 8);
    return `<section class="card">${brand(day, '结算')}<h1>昨天出了结果的问题</h1><p class="sub">过去 36 小时结算 · 按成交量</p>
      <div class="rows">${rows.map(r => `<div class="row" style="grid-template-columns:110px 1fr 140px"><div><span class="chip ${/^yes$/i.test(r.result) ? 'yes' : ''}">${esc(r.result)}</span></div><div class="t">${zh(r.question)}</div><div class="d" style="text-align:right">${usd(r.volume)}</div></div>`).join('')}</div>
      ${foot('Yes / No = 最终归一的选项')}</section>`;
  },
  new(day) {
    const rows = newRows(day, 6);
    return `<section class="card">${brand(day, '新上线')}<h1>今天新上线的市场</h1><p class="sub">官方公告 + 过去 24 小时新上线 · 首日概率</p>
      <div class="rows">${rows.map(e => `<div class="row" style="grid-template-columns:1fr"><div class="t">${esc(label(e.title))}${e.official ? '<span class="tag">官方公告</span>' : ''}${e.outcomes && e.outcomes.length ? `<small style="white-space:normal">${e.outcomes.slice(0, 3).map(o => `${esc(outcomeLabel(o.label))} ${pct(o.yes)}`).join(' · ')}</small>` : ''}</div></div>`).join('')}</div>
      ${foot('新市场往往就是新闻本身')}</section>`;
  },
};
// A post ships the first five, same order every day. "new" and "feed" are dashboard-only previews.
const ORDER = [['cover', '封面', true], ['headline', '头条走势', true], ['breaking', '突发榜', true], ['hot', '长期关注', true], ['resolved', '结算', true], ['new', '新上线（仅 Dashboard）', false]];
const eligible = k => k !== 'new';
// Fixed-size cards: when a list does not fit, drop rows from the bottom rather than shrink type.
const fit = () => document.querySelectorAll('.card').forEach(c => { const rows = c.querySelector('.rows'); let g = 40; while (rows && c.scrollHeight > c.offsetHeight && rows.children.length > 3 && g--) rows.removeChild(rows.lastElementChild); });

(async () => {
  const idx = await PM.loadIndex(), date = idx.dates.includes(q.get('date')) ? q.get('date') : idx.latest;
  const { day, xhs, cards } = await PM.loadDay(date);
  FOOT_DAY = day;
  const first = (xhs || '').split('\n').find(l => /^1\./.test(l)); if (first) day.xhsFirst = first.replace(/^1\.\s*\S+\s*/, '');
  const root = document.getElementById('root'), card = q.get('card');
  if (card && CARDS[card]) { document.body.classList.add('single'); root.innerHTML = CARDS[card](day); document.title = `卡片 · ${card} · ${date}`; fit(); return; }
  const on = ORDER.filter(([k, , fixed]) => fixed || eligible(k, day)), png = Object.fromEntries(cards.map(c => [c.key, c.file]));
  root.innerHTML = `<div class="ghead"><b>${esc(date)}</b> · ${on.length} 张会出：${on.map(o => o[1]).join('、')}。${cards.length ? `已生成 ${cards.length} 张 PNG。<button id="dlAll">全部下载 zip</button>` : '今天的 PNG 还没生成，"单张"打开后可手动截图。'}</div>
    <div class="gallery">${ORDER.map(([k, name, fixed], i) => `<div class="thumb"><div class="frame">${CARDS[k](day)}</div><div class="cap"><span>${i + 1}. ${esc(name)}${fixed || eligible(k, day) ? '' : ' <span class="off">· 今天不出</span>'}</span><span>${png[k] ? `<a href="cards/${date}/${png[k]}" download="polymarket-${date}-${png[k]}">下载 PNG</a> · ` : ''}<a href="?date=${date}&card=${k}" target="_blank">单张</a></span></div></div>`).join('')}</div>`;
  fit();
  const dl = document.getElementById('dlAll'); if (dl) dl.onclick = () => PM.downloadZip(date, cards, dl);
})();
</script>
</body>
</html>
